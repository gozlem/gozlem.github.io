description: 'Our research spans AI applied to bioinformatics, responsible AI, and social cybersecurity, with a focus on developing new AI methodologies, algorithms, and systems that are fair, interpretable, and socially responsible.'

areas:
  - title: 'AI Applied to Bioinformatics'
    description: 'Developing new AI methodology, algorithms, and systems for medical and biological science, including drug discovery, molecular design, and Drug Target Interaction prediction.'
    tags:
      - 'Drug Discovery'
      - 'Molecular Design'
      - 'Drug Target Interaction'
      - 'Bioinformatics'
  - title: 'Responsible AI'
    description: 'Advancing fairness, interpretability, human-centered design, and bias mitigation in AI systems to ensure they are equitable, transparent, and trustworthy.'
    tags:
      - 'Fairness'
      - 'Interpretability'
      - 'Human-Centered Design'
      - 'Bias Mitigation'
  - title: 'Social Cybersecurity'
    description: 'Building AI models to understand and counter influence operations on social and traditional media, with a focus on social contagion, information cascades, and network analysis.'
    tags:
      - 'Influence Operations'
      - 'Social Media Analysis'
      - 'Network Science'
      - 'Information Cascades'
  - title: 'Evolutionary Computation & Complex Systems'
    description: 'Research on genetic algorithms, modularity in search spaces, and complex adaptive systems applied to optimization and design problems.'
    tags:
      - 'Genetic Algorithms'
      - 'Modularity'
      - 'Complex Systems'
      - 'Optimization'
